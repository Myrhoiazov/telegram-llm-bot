services:
  telegram-bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      POLL_TIMEOUT_SECONDS: ${POLL_TIMEOUT_SECONDS:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_CHAT_ID: ${ALLOWED_CHAT_ID:-}
      TYPING_ACTION_INTERVAL_SECONDS: ${TYPING_ACTION_INTERVAL_SECONDS:-4}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-30}
      EXEC_TIMEOUT_SECONDS: ${EXEC_TIMEOUT_SECONDS:-20}
      EXEC_WORKSPACE_DIR: /app/workspace
      MEMORY_DB_PATH: /app/data/memory.sqlite3
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-993}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      TRACE_ENABLED: ${TRACE_ENABLED:-true}
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
      TRACE_MAX_LIST_LIMIT: ${TRACE_MAX_LIST_LIMIT:-100}
      STT_ENABLED: ${STT_ENABLED:-true}
      STT_PROVIDER: ${STT_PROVIDER:-lemonade}
      STT_BASE_URL: ${STT_BASE_URL:-http://host.docker.internal:13305}
      STT_MODEL: ${STT_MODEL:-Whisper-Base}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-60}
      VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-60}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
    volumes:
      - bot_data:/app/data
    restart: unless-stopped

volumes:
  bot_data:
