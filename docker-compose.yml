services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  telegram-bot:
    build: .
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:1.7b}
      POLL_TIMEOUT_SECONDS: ${POLL_TIMEOUT_SECONDS:-30}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_CHAT_ID: ${ALLOWED_CHAT_ID:-}
      TYPING_ACTION_INTERVAL_SECONDS: ${TYPING_ACTION_INTERVAL_SECONDS:-4}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      MAX_CONTEXT_MESSAGES: ${MAX_CONTEXT_MESSAGES:-30}
      EXEC_TIMEOUT_SECONDS: ${EXEC_TIMEOUT_SECONDS:-20}
      EXEC_WORKSPACE_DIR: /app/workspace
      MEMORY_DB_PATH: /app/data/memory.sqlite3
      EMAIL_IMAP_HOST: ${EMAIL_IMAP_HOST:-}
      EMAIL_IMAP_PORT: ${EMAIL_IMAP_PORT:-993}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
    volumes:
      - bot_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
  bot_data:
